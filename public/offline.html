<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · Renewal Guard</title>
    <style>
        :root {
            color-scheme: light dark;
            --canvas: #f7f6f8;
            --surface: #ffffff;
            --ink: #16151a;
            --ink-600: #5c5966;
            --ink-100: #edecef;
            --accent: #4338ca;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --canvas: #131218;
                --surface: #1c1a23;
                --ink: #f4f3f6;
                --ink-600: #a5a2b0;
                --ink-100: #2b2833;
                --accent: #9b90ff;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--canvas);
            color: var(--ink);
            font-family: "DM Sans Variable", ui-sans-serif, system-ui, sans-serif;
        }

        .card {
            max-width: 380px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--ink-100);
            border-radius: 12px;
            padding: 28px 24px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
            color: var(--ink-600);
        }

        button {
            margin-top: 20px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            border: 0;
            border-radius: 9px;
            padding: 12px 20px;
            min-height: 44px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You are offline</h1>
        <p>Expiry dates change, so this app does not show you a stale copy. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
